name: B2B Release Verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: b2b-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-tests:
    name: PHP release gates
    runs-on: ubuntu-22.04
    env:
      APP_ENV: testing
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      BCRYPT_ROUNDS: 4
      CACHE_DRIVER: array
      DB_CONNECTION: sqlite_memory
      MAIL_DRIVER: array
      MAIL_MAILER: array
      QUEUE_DRIVER: sync
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      APP_CONFIG_CACHE: bootstrap/cache/config.ci.php
      APP_SERVICES_CACHE: bootstrap/cache/services.ci.php
      APP_PACKAGES_CACHE: bootstrap/cache/packages.ci.php
      APP_ROUTES_CACHE: bootstrap/cache/routes.ci.php
      APP_EVENTS_CACHE: bootstrap/cache/events.ci.php
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, json, mbstring, openssl, pdo, pdo_sqlite, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Syntax lint tracked PHP
        run: |
          git ls-files '*.php' \
            ':!:vendor/*' \
            ':!:node_modules/*' \
            ':!:app/Games/*' \
            ':!:storage/*' \
            ':!:bootstrap/cache/*' \
            | xargs -r -n 1 php -l

      - name: Syntax lint deployment shell scripts
        run: |
          find deploy/scripts -maxdepth 1 -type f -name '*.sh' -print0 \
            | xargs -0 -r -n 1 bash -n

      - name: Laravel route boot and cache
        run: |
          php artisan config:clear
          php artisan route:list --json > /tmp/b2b-routes.json
          php artisan route:cache
          php artisan route:clear

      - name: Verify clean and repeatable migrations
        run: |
          tmp="$(mktemp -d)"
          touch "$tmp/database.sqlite"
          DB_CONNECTION=sqlite DB_DATABASE="$tmp/database.sqlite" php artisan migrate:fresh --force --no-interaction
          DB_CONNECTION=sqlite DB_DATABASE="$tmp/database.sqlite" php artisan migrate --force --no-interaction | tee "$tmp/migrate-repeat.log"
          grep -q 'Nothing to migrate' "$tmp/migrate-repeat.log"

      - name: Verify release evidence template generation
        run: |
          tmp="$(mktemp -d)"
          php artisan b2b:evidence-template "$tmp" --release-id=ci-template --environment=staging --commit="${GITHUB_SHA:-ci}"
          php -r '
              $manifest = json_decode(file_get_contents($argv[1] . "/release-evidence.json"), true);
              foreach (["queue_runtime_drill", "prometheus_scrape", "alertmanager_notification", "log_shipping", "correlation_validation"] as $key) {
                  if (!isset($manifest["evidence"][$key])) {
                      fwrite(STDERR, "Missing evidence entry: " . $key . PHP_EOL);
                      exit(1);
                  }
              }
              echo "release evidence template ok" . PHP_EOL;
          ' "$tmp"

      - name: Run PHPUnit
        run: php vendor/phpunit/phpunit/phpunit --testdox --colors=never

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Composer audit
        run: composer audit --locked --no-dev --format=plain --abandoned=fail

  websocket-runtime:
    name: Node/WebSocket runtime gates
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install WebSocket dependencies
        working-directory: PTWebSocket
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit WebSocket dependencies
        working-directory: PTWebSocket
        run: pnpm audit --prod

      - name: Syntax check WebSocket runtime
        working-directory: PTWebSocket
        run: pnpm run check:syntax

      - name: Validate WebSocket production config
        working-directory: PTWebSocket
        run: pnpm run check:production-config

  production-release-check:
    name: Production release-check command
    runs-on: ubuntu-22.04
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      QUEUE_FAILED_DRIVER: database-uuids
      B2B_NONCE_CACHE_STORE: redis
      B2B_RATE_LIMIT_CACHE_STORE: redis
      B2B_SCHEDULER_HEARTBEAT_CACHE_STORE: redis
      B2B_SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS: '180'
      B2B_SANDBOX_ENABLED: 'false'
      B2B_ALLOW_PRIVATE_WALLET_CALLBACKS: 'false'
      B2B_STRUCTURED_LOGGING_ENABLED: 'true'
      B2B_STRUCTURED_LOG_CHANNEL: b2b
      DB_CONNECTION: sqlite_memory
      REDIS_HOST: 127.0.0.1
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: 'true'
      SESSION_HTTP_ONLY: 'true'
      SESSION_SAME_SITE: lax
      LOGIN_THROTTLE_PRODUCTION_ENFORCED: 'true'
      LOGIN_THROTTLE_MAX_ATTEMPTS: '10'
      LOGIN_THROTTLE_LOCKOUT_MINUTES: '1'
      PASSWORD_POLICY_MIN_LENGTH: '12'
      PASSWORD_POLICY_MAX_LENGTH: '72'
      PASSWORD_POLICY_REQUIRE_MIXED_CASE: 'true'
      PASSWORD_POLICY_REQUIRE_NUMBERS: 'true'
      PASSWORD_POLICY_REQUIRE_SYMBOLS: 'false'
      PASSWORD_POLICY_DISALLOW_WHITESPACE: 'true'
      PASSWORD_POLICY_TEMPORARY_LENGTH: '16'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, ctype, curl, dom, fileinfo, gd, json, mbstring, openssl, pdo, pdo_sqlite, redis, tokenizer, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install WebSocket dependencies
        working-directory: PTWebSocket
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run B2B production release-check
        run: php artisan b2b:release-check --production
