route:
  group_by: [alertname, service, route]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  receiver: b2b-ops
  routes:
    - matchers:
        - service="bbb-b2b"
        - severity="critical"
      receiver: b2b-pager
    - matchers:
        - service="bbb-b2b"
      receiver: b2b-ops

receivers:
  - name: b2b-pager
    webhook_configs:
      - url: https://alertmanager.example.invalid/b2b-critical
        send_resolved: true

  - name: b2b-ops
    webhook_configs:
      - url: https://alertmanager.example.invalid/b2b-ops
        send_resolved: true
